name: Deploy to GitHub Pages

# A push to main runs the full CI checks first, then builds and publishes the site.
# One-time setup: Settings > Pages > Source: GitHub Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Read the Pages settings
        id: pages
        uses: actions/configure-pages@v6

      # The base path is never hard-coded. Use what Pages reports, which can legitimately be empty
      # (a custom domain, or a privately published site). Fall back to /<repo> only when it reports nothing.
      - name: Work out the base path
        id: base
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PAGES_BASE_URL" ]; then path="$PAGES_BASE_PATH"; else path="/$REPO_NAME"; fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "Base path is '${path:-/}'"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
