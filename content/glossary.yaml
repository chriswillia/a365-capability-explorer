- id: agent-registry
  term: "Agent Registry"
  aliases: []
  definition: "The inventory of agents available to an organization, with publisher types and administrative actions."
  sourceId: a365-registry
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-24"
- id: delegated-access
  term: "Delegated access"
  aliases: ["On-behalf-of access"]
  definition: "The agent acts for a signed-in user, whose token also identifies the agent. Microsoft's Entra documentation also calls this on-behalf-of (OBO) access. User policies, including Conditional Access, apply."
  sourceId: entra-ca-agents
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
- id: own-access
  term: "Own access"
  aliases: ["Application-only access", "Autonomous agent"]
  definition: "The agent acts as itself, through its own agent identity and permissions, with no signed-in user needed. Microsoft's documentation calls this application-only or autonomous access. The pages reviewed do not use the word owned."
  sourceId: entra-security-for-ai
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
- id: agent-user
  term: "Agent user"
  aliases: ["Agent's user account", "Agent account"]
  definition: "An optional user account paired one to one with an agent identity. It gives the agent a mailbox, calendar and Teams presence like a person, and does not replace the agent identity."
  sourceId: entra-security-for-ai
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
- id: access-packages
  term: "Access packages"
  aliases: []
  definition: "Packages that define the scope of agent permissions."
  sourceId: sd-a365
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-24"
- id: dlp
  term: "Data loss prevention"
  aliases: [DLP]
  definition: "Controls that block agents from accessing and sharing sensitive content."
  sourceId: sd-a365
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-24"
- id: mcp
  term: "Model Context Protocol"
  aliases: [MCP]
  definition: "The protocol used by governed Work IQ tool servers in the Agent 365 developer integration."
  sourceId: a365-sdk
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-24"
- id: observability
  term: Observability
  aliases: []
  definition: "Visibility into agent activity through telemetry and monitoring. Registration alone does not add telemetry."
  sourceId: a365-quickstart
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-24"
- id: blueprint
  term: "Agent identity blueprint"
  aliases: [blueprint]
  definition: "The Microsoft Entra registration foundation from which the developer setup creates an agent identity."
  sourceId: a365-quickstart
  evidence: inferred
  reviewStatus: draft
  lastVerified: "2026-10-24"
- id: sdk
  term: "Agent 365 SDK"
  aliases: []
  definition: "Packages that extend an existing agent with identity, governed tooling and notifications. New observability integrations use Microsoft OpenTelemetry separately."
  sourceId: a365-sdk
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-24"
- id: sponsor
  term: Sponsor
  aliases: [Sponsors]
  definition: "A business representative accountable for an agent's purpose and lifecycle decisions, such as access reviews and retention, without technical administrative access. Every agent identity and blueprint needs at least one sponsor. Owners, who administer the agent, are optional."
  sourceId: entra-agent-sponsors
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
- id: agent-owner
  term: "Agent owner"
  aliases: ["Agent owners"]
  definition: "Usually the technical administrator of an agent. Owners are optional, can be users or service principals, and cannot be groups. They can change properties that a sponsor cannot, such as authentication."
  sourceId: entra-agent-sponsors
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
- id: entra-agent-id
  term: "Microsoft Entra Agent ID"
  aliases: ["Entra Agent ID"]
  definition: "The Microsoft Entra identity types for agents: agent identities, agent identity blueprints, blueprint principals and agent user accounts. Each has owners, sponsors and managers."
  sourceId: entra-agent-sponsors
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
- id: connected-platform
  term: "Connected platform"
  aliases: ["Connected platforms"]
  definition: "A supported non-Microsoft agent platform, such as Amazon Bedrock or Google Vertex AI. After an administrator connects it, Agent 365 can discover its agents and add them to the registry. Connections are read-only."
  sourceId: a365-connected-platforms
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
- id: prerequisite-license
  term: "Prerequisite license"
  aliases: ["Prerequisite licenses"]
  definition: "A license that must be bought alongside Agent 365. The Microsoft Product Terms list the qualifying plans, for example Microsoft 365 E5 or Business Premium."
  sourceId: product-terms-a365
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
- id: shadow-ai
  term: "Shadow AI"
  aliases: []
  definition: "Consumer-facing AI applications and standalone agents deployed across an organization without IT visibility or approval."
  sourceId: a365-shadow-ai
  evidence: stated
  reviewStatus: draft
  lastVerified: "2026-10-27"
