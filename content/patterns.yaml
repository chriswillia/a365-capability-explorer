- id: assistant-with-jobs
  title: "Assistant that also runs scheduled jobs"
  summary: "A Copilot Studio assistant answers staff in chat for the signed-in user and also runs scheduled jobs under its own access."
  narrative: "Chat uses delegated access, so user policies and the delegating users' licenses apply. The scheduled jobs use the agent's own identity, so sponsorship and scoped permissions apply too. Microsoft's Entra documentation says a policy on one target does not cover the others, so check both."
