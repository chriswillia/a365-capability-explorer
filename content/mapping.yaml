neutralOrg:
  cloudEnvironment: commercial
  agentEstate: one
  orgGovernance: [none]
  securityOps: [none]
  shadowAI: "no"
readinessChecks:
  - id: teammate-frontier
    appliesWhen: { q: accessModel, equals: own-teammate }
    when: { not: { q: frontierProgram, equals: enrolled } }
    gap: Verify Frontier preview enrollment before using an agent user account and notifications.
    evidence: stated
    sourceId: a365-sdk
licensingNote: "Foundational and premium counts follow the service description. User range is the illustrative audience, not a license quantity. Who needs a license follows how the agent acts, as the license basis states. Prerequisites and quantities still need your licensing specialist; no license quote or eligibility approval is produced."
licensingSourceIds: [sd-a365, lic-faq]
licenseBasis:
  delegated: "Users who delegate their access to the agent need an Agent 365 license."
  own: "The owner, sponsor or manager of the agent needs an Agent 365 license."
  mixed: "Both apply: the users who delegate their access, and the owner, sponsor or manager of the agent."
