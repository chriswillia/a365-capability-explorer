capabilities:
  - capabilityId: entra-conditional-access
    delegated: differs
    own: applies
    agentAccount: applies
    note: "Separate policies target users and groups (delegated), the agent identity or blueprint (own access) and the agent's user account. A policy on one target does not cover the others. In delegated flows, ID Protection attributes risk to the user, not the agent."
    sourceIds: [entra-ca-agents, entra-idp-agents]
    evidence: stated
    reviewStatus: draft
    lastVerified: "2026-10-27"
  - capabilityId: entra-access-packages
    delegated: not-stated
    own: applies
    agentAccount: not-stated
    note: "Access packages give agent identities resource access directly. Agents, or their owners or sponsors on their behalf, can request them. The documentation does not describe them for delegated agents."
    sourceIds: [entra-agent-id-governance]
    evidence: stated
    reviewStatus: draft
    lastVerified: "2026-10-27"
  - capabilityId: entra-sponsor-lifecycle
    delegated: not-stated
    own: applies
    agentAccount: not-stated
    note: "Sponsor workflows act on the sponsors of agent identities, so they apply to agents that have their own identity. The documentation does not say whether delegated-only agents have sponsors."
    sourceIds: [entra-agent-sponsor-tasks]
    evidence: stated
    reviewStatus: draft
    lastVerified: "2026-10-27"
