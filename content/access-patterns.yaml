  differs: "Applies differently"
  not-stated: "Not stated"
statedHeading: "What Microsoft's documentation states by access pattern"
unsplitHeading: "Everything else"
unsplit: "For the other capabilities, Microsoft's documentation describes how they apply to an agent or agent instance and does not say whether delegated, own-access or agent-account agents differ. Treat them as applying to every pattern, and confirm before you claim a difference."
tensionHeading: "Where the sources differ"
tension:
  text: "The service description words Conditional Access and Identity Protection for agents as for agents with delegated access. Microsoft's Entra documentation also describes policies for agents that act with their own identity and for agent user accounts. The Entra pages are the fuller and more recent statement; verify before you answer."
  sourceIds: [sd-a365, entra-ca-agents]
  evidence: judgment
  reviewStatus: draft
  lastVerified: "2026-10-27"
