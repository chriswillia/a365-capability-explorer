# How an agent acts, in Microsoft's terms (read 2026-10-27). The Microsoft pages reviewed do not use the word "owned":
# they say an agent acts with its own identity, credentials or access. This site labels that "Own access".
# Per-capability statements exist only where Microsoft's documentation makes one. Everything else is "not stated".
reviewStatus: draft
intro: "Microsoft describes three ways an agent can act. They change whose identity is the subject of access, which policies target it and which people need a license."
notice: "Microsoft's documentation does not split most Purview and Defender controls by access pattern. Where it is silent, this page says so instead of guessing."
termsNote: "The Microsoft pages reviewed do not use the word owned. They say the agent acts with its own identity, credentials or access. This site calls that Own access."
patternsHeading: "Three ways an agent acts"
termsLabel: "Microsoft's terms"
licenseLabel: "Who to license"
questionLabel: "Assessment answers"
jumpLabel: "On this page"
assessmentLabel: "Show this for an assessment"
noAssessment: "No assessment selected"
thisAgent: "This assessment: {label}"
thisAgentUnknown: "This assessment has not said how the agent acts."
viewNoAssessment: "Choose an assessment above to see which capabilities change for that agent."
openLicensing: "Open licensing"
answerLabels:
  delegated: "Delegated access"
  own-teammate: "Own access with an agent account"
  own-background: "Own access"
  mixed: "Delegated and own access"
patterns:
  - id: delegated
    label: "Delegated access"
    terms: ["Delegated access", "On-behalf-of (OBO)"]
    plain: "The agent acts for a signed-in user. The token represents the user and also identifies the agent, so policies that target users and groups apply."
    answers: [delegated, mixed]
    licensingIds: [delegating-users]
    sourceIds: [entra-ca-agents, entra-security-for-ai]
    evidence: stated
    reviewStatus: draft
    lastVerified: "2026-10-27"
  - id: own
    label: "Own access"
    terms: ["Application-only access", "Client credentials", "Autonomous agent", "Agent identity"]
    plain: "The agent acts as itself, with its own agent identity and permissions, and needs no signed-in user. Policies target the agent identity or its blueprint."
    answers: [own-background, mixed]
    licensingIds: [own-access-owners]
    sourceIds: [entra-ca-agents, entra-security-for-ai]
    evidence: stated
    reviewStatus: draft
    lastVerified: "2026-10-27"
  - id: agent-account
    label: "Own access with an agent account"
    terms: ["Agent-user access", "Agent's user account"]
    plain: "The agent also has its own user account, paired with its agent identity, with a mailbox, calendar and Teams presence like a person. Policies target that account."
    answers: [own-teammate, mixed]
    licensingIds: [own-access-owners]
    sourceIds: [entra-ca-agents, entra-security-for-ai]
    evidence: stated
    reviewStatus: draft
    lastVerified: "2026-10-27"
viewHeading: "How recommendations change with how the agent acts"
viewIntro: "Recommendations for this assessment are recomputed under each way of acting, using this tool's rules, which follow the service description's wording. Capabilities in scope under every way are listed last."
