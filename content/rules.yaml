        sourceIds: [sd-a365],
      }
    - {
        capability: defender-posture,
        level: essential,
        because: "Review local agent exposure and relationships.",
        evidence: stated,
        sourceIds: [sd-a365],
      }
    - {
        capability: intune-block-local,
        level: recommended,
        because: "Control unsanctioned local endpoint agents.",
        evidence: stated,
        sourceIds: [sd-a365],
      }
    - {
        capability: intune-runtime-policy,
        level: recommended,
        because: "Review a policy-controlled local runtime.",
        evidence: inferred,
        sourceIds: [sd-a365],
      }
    - {
        capability: entra-network-controls,
        level: recommended,
        because: "The network capability covers agents operating on user devices.",
