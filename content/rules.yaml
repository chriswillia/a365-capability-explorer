          { q: dataSensitivity, in: [confidential, highly-confidential] },
          {
            q: regulatedData,
            includesAny:
              [personal, payment-card, health, financial-reporting, employee, trade-secrets],
          },
        ],
    }
  recommend:
    - {
        capability: purview-labels,
        level: essential,
        because: "Honor sensitivity labels on data used by agents.",
        evidence: inferred,
        sourceIds: [sd-a365],
      }
    - {
        capability: purview-dlp,
        level: essential,
        because: "Protect sensitive content from inappropriate access or sharing.",
        evidence: inferred,
        sourceIds: [sd-a365],
      }
    - {
        capability: purview-dspm-ai,
        level: recommended,
        because: "Review agent interactions and data posture.",
        evidence: judgment,
        sourceIds: [sd-a365],
      }
    - {
        capability: purview-insider-risk,
        level: recommended,
        because: "Review anomalous or risky agent activity around sensitive data.",
        evidence: judgment,
        sourceIds: [sd-a365],
      }
  advisories: []
  reviewStatus: draft
- id: labeling-gap
  scope: useCase
  description: Sensitive data with incomplete labeling needs a readiness discussion.
  when:
