        ],
    }
  recommend:
    - {
        capability: defender-threat-protection,
        level: essential,
        because: "Detect suspicious behavior and review blocking risky tool invocations.",
        evidence: inferred,
        sourceIds: [sd-a365],
      }
    - {
        capability: observability,
        level: essential,
        because: "Track consequential agent activity.",
        evidence: judgment,
        sourceIds: [sd-a365],
      }
    - {
        capability: purview-audit-ediscovery,
        level: essential,
        because: "Retain an investigation trail for consequential actions.",
        evidence: inferred,
        sourceIds: [sd-a365],
      }
    - {
        capability: policy-templates,
        level: recommended,
        because: "Establish policy guardrails for consequential actions.",
        evidence: judgment,
        sourceIds: [sd-a365],
      }
  advisories: []
  reviewStatus: draft
- id: external-audience
