# Recommendation levels are editorial planning judgments, not official licensing requirements.
# "stated" marks the capability/source applicability basis, not an official mandate.
- id: baseline
  scope: useCase
  description: Inventory and central governance form a baseline for every agent discussion.
  when: { always: true }
  recommend:
    - {
        capability: registry-inventory,
        level: essential,
        because: "A known inventory is the starting point for governance.",
        evidence: inferred,
        sourceIds: [sd-a365],
      }
    - {
        capability: governance-actions,
        level: essential,
        because: "Administrators need levers to approve, restrict and retire agents.",
        evidence: inferred,
        sourceIds: [sd-a365, a365-admin-overview],
      }
  advisories: []
  reviewStatus: draft
- id: pilot
  scope: useCase
  description: Pilot and later stages need activity visibility and accountable sponsorship.
  when: { q: stage, in: [pilot, production, scaling] }
  recommend:
    - {
        capability: observability,
        level: recommended,
        because: "A pilot needs observable activity before wider rollout.",
        evidence: judgment,
        sourceIds: [sd-a365],
      }
    - {
        capability: entra-sponsor-lifecycle,
        level: recommended,
        because: "Review sponsor accountability through the rollout.",
        evidence: judgment,
        sourceIds: [sd-a365],
      }
  advisories: []
  reviewStatus: draft
- id: production
  scope: useCase
  description: Production and scaling increase the importance of monitoring.
  when: { q: stage, in: [production, scaling] }
  recommend:
    - {
        capability: observability,
        level: essential,
        because: "Operating production agents needs sustained visibility.",
        evidence: judgment,
        sourceIds: [sd-a365],
      }
  advisories: []
  reviewStatus: draft
- id: external-platform
  scope: useCase
  description: Connected external platforms need registry synchronization.
  when: { q: buildPlatform, in: [hyperscaler, saas-platform] }
  recommend:
    - {
        capability: registry-sync,
        level: essential,
        because: "Synchronize agents and metadata from connected external platforms.",
        evidence: stated,
        sourceIds: [sd-a365, a365-sdk],
      }
  advisories: [registry-sync]
  reviewStatus: draft
- id: pro-code
  scope: useCase
  description: Custom-code integration needs explicit instrumentation and permission planning.
  when: { q: buildPlatform, in: [pro-code-microsoft, pro-code-third-party] }
  recommend:
    - {
        capability: observability,
        level: essential,
        because: "Registration provides catalog visibility; telemetry needs instrumentation.",
        evidence: stated,
        sourceIds: [a365-quickstart],
      }
    - {
        capability: entra-access-packages,
        level: recommended,
        because: "Review the scope of agent permissions for the chosen integration.",
        evidence: judgment,
        sourceIds: [sd-a365],
      }
  advisories: [agent365-sdk]
  reviewStatus: draft
- id: copilot-studio
  scope: useCase
  description: Copilot Studio has a documented native registration path.
  when: { q: buildPlatform, equals: copilot-studio }
  recommend: []
  advisories: [native]
  reviewStatus: draft
- id: copilot-network
  scope: useCase
  description: Copilot Studio agents with browsing or egress need network-control consideration.
  when:
    {
      all:
        [
          { q: buildPlatform, equals: copilot-studio },
          { any: [{ q: tools, includes: web-browsing }, { q: networkEgress, equals: "yes" }] },
        ],
    }
  recommend:
    - {
        capability: entra-network-controls,
        level: essential,
        because: "The service description explicitly covers Copilot Studio agent network traffic.",
        evidence: stated,
        sourceIds: [sd-a365],
      }
  advisories: []
  reviewStatus: draft
- id: local-agent
  scope: useCase
  description: Local agents bring endpoint controls into scope.
  when: { q: buildPlatform, equals: local-agent }
  recommend: &endpointControls
