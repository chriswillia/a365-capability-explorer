# Capability catalog (brief section 4).
#
# source.featureText and the three availability flags are copied from the Microsoft Agent 365 service
# description (sd-a365), checked against content/source-snapshot.json. Do not paraphrase them.
# Everything else (pillar, wave, control points, setup, lifecycle stages and all text fields) is editorial
# and stays reviewStatus: draft until a subject-matter expert signs it off.
#
# TODO(verify): every sourceNotes entry with sourceId lic-faq was taken from the build brief. The licensing
# FAQ could not be fully read on 2026-10-23, so those statements need checking against the live page.

- id: registry-inventory
  shortName: Agent Registry inventory
  source:
    sourceId: sd-a365
    featureText: "Inventory of agents across the organization in the Agent Registry"
    console: Microsoft 365 admin center
    includedWithBasePlans: true
    availableWithE7G7OrA365: true
    gccAvailable: true
    lastVerified: "2026-10-23"
  pillar: observe
  defaultWave: 1
  controlPoints: [registry]
  setup: platform
  lifecycleStages: [build, operate]
  summary: "Lists the agents across your organization in the Agent Registry. Each entry shows who published it: Microsoft, an external partner, your organization, or an individual creator."
  executiveValue: "One place to see which agents the organization has, before deciding how to govern them."
  withoutIt: "Agents built by different teams and tools can go unseen, so nobody can say how many exist or who owns them."
  withIt: "Admins see every registered agent in one list, which is the starting point for ownership, policy and lifecycle decisions."
  questionsItAnswers:
    - "How many agents do we have in our organization?"
    - "Where can I see all of our agents in one place?"
  discoveryQuestions:
    - "Which teams are building or sharing agents today?"
    - "Who tracks the list of agents in use right now?"
  sourceNotes:
    - sourceId: a365-registry
      note: "Registry entries carry a publisher type: Microsoft, external partner-built, published by your org, or shared by creator."
  tags: [inventory, catalog, discovery, agent list]
  reviewStatus: draft

- id: governance-actions
  shortName: Core governance actions
  source:
    sourceId: sd-a365
    featureText: "Basic governance actions on agents (publish, deploy, block, delete, approve; assign agents to specific user/groups; reassign agent owner, pin, etc.)"
    console: Microsoft 365 admin center
    includedWithBasePlans: true
    availableWithE7G7OrA365: true
    gccAvailable: true
    lastVerified: "2026-10-23"
  pillar: govern
  defaultWave: 1
  controlPoints: [registry]
  setup: agent
  lifecycleStages: [deploy, operate, retire]
  summary: "Lets admins act on agents in the Microsoft 365 admin center: publish, deploy, block, delete or approve them, assign them to specific users or groups, reassign an owner, and pin them, among other actions."
  executiveValue: "Gives administrators direct levers over which agents are available, to whom, and who is accountable for each."
  withoutIt: "Admins may lack a central way to block, approve or reassign agents, so changes depend on whoever built them."
  withIt: "Admins can approve, restrict, reassign or remove agents centrally and choose which users or groups can reach each one."
  questionsItAnswers:
    - "How do I block or remove an agent?"
    - "How do I limit an agent to certain users or groups?"
    - "Who approves agents before they are published?"
  discoveryQuestions:
    - "Who should approve agents before they reach the wider organization?"
    - "What should happen to an agent when its owner leaves?"
  tags: [block, approve, publish, assign, reassign owner, pin]
  reviewStatus: draft

