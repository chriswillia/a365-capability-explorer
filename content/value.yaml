# The value story for Agent 365, for any agent and any use case. Facts carry their Microsoft source and the date it was read.
# Pitches, angles, buyer notes, objection answers and the joint plan are editorial: seller guidance, draft until
# subject-matter-expert review. The statistics in Proof you can cite each name who published them and say whether
# they are Microsoft's own. This file states no price and no competitor comparison.
reviewStatus: draft
intro: "Explain why Agent 365 matters to a customer, whatever agent they are building: the problem every agent creates, what Agent 365 gives the customer, and how to say it to each buyer."
notice: "Seller guidance, not Microsoft messaging. Facts name their Microsoft source. Pitches, angles and objection answers are editorial and stay draft until subject-matter-expert review."
views:
  say: "Say it"
  prepare: Prepare
  run: "Run the meeting"
  brief: "Value brief"
audienceNote: "Showing the {label} version. Change it in the View menu."
pitch:
  heading: "Your 60-second pitch"
  intro: "Use the version that matches your role. All three rest on the same facts."
  beatsLabel: "Say it in four beats"
  askLabel: "The ask"
  othersLabel: "See the other versions"
  audiences:
    ai:
      label: "AI seller"
      opening: "Every agent your customer builds needs an owner, the right access and a record of what it does. Agent 365 gives IT and security one place to see and govern agents, so teams can keep building."
      beats:
        - "Agents are multiplying across apps, endpoints and clouds, and the teams accountable for risk often cannot see them."
        - "Agent 365 is the control plane to observe, govern and secure agents, whether they are built on Microsoft platforms, open-source frameworks or partner clouds."
        - "It adds lightweight guardrails for observability and accountability, so teams keep moving while IT and security stay in control."
        - "Customers take agents from pilot to production with clear answers to the owner, access, data and monitoring questions security will ask."
      ask: "Agree one agent to scope together, and who from security and compliance should join."
    security:
      label: "Security seller"
      opening: "Agents are a new kind of non-human actor, with their own identity, data access and tool access. Agent 365 extends the Entra, Defender and Purview controls your customer already runs to those agents."
      beats:
        - "Existing controls for users, apps and data do not fully cover how agents operate, and agents multiply with no clear oversight."
        - "Agent 365 gives every agent an identity and an owner, and brings it under the Conditional Access, data protection and threat detection the customer already trusts."
        - "Your practitioners keep working in the Entra, Purview and Defender portals, where agent insights and recommendations appear."
        - "Start with visibility: you cannot govern what you cannot see, and you cannot secure what you do not understand."
      ask: "Agree who owns agent security today, and book a working session to inventory the agents in use."
    joint:
      label: "AI and Security together"
      opening: "The agent the customer wants to scale is the agent security needs to see, constrain and audit. One control plane serves both teams."
      beats:
        - "The AI team brings the use case and the value. The security team brings the guardrails that let it reach production."
        - "Agent 365 gives both teams one view: which agents exist, who owns them, what they can reach and what they do."
        - "Each team keeps to the tools it already uses: the admin center for IT, and Entra, Purview and Defender for security."
        - "Scope one real agent together, then agree what must be in place before pilot and before production."
      ask: "Agree one agent to scope, and name one person from each side."
  sourceIds: [a365-docs, a365-ga-blog, a365-why, a365-security, a365-launch-blog]
  evidence: judgment
  reviewStatus: draft
problem:
  heading: "The problem, in Microsoft's words"
  intro: "Paraphrased from Microsoft's own pages. These hold for any agent."
  statements:
    - id: sprawl
      text: "Existing controls for users, applications and data do not fully address how agents operate. Without a central view, agents multiply with no clear oversight. Microsoft calls this agent sprawl."
      sourceIds: [a365-why]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: proliferation
      text: "Agents spread quickly across apps, endpoints and cloud, and often operate outside the visibility and control of the teams accountable for risk."
      sourceIds: [a365-ga-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: visibility-first
      text: "Microsoft's framing is that you cannot govern what you cannot see, and you cannot secure what you do not understand."
      sourceIds: [a365-ga-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: security-questions
      text: "Security leaders are asking how to track all these agents, what they are doing, whether they have the right access, whether they can leak data, whether they are protected from threats, and how to govern them."
      sourceIds: [a365-frontier-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: point-solutions
      text: "Microsoft argues this needs more than point solutions: a control plane designed for managing agents at enterprise scale."
      sourceIds: [a365-why]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: agentic-zero-trust
      text: "Microsoft's guidance for security leaders is Agentic Zero Trust: do not trust agents blindly, keep each agent's access within its role and purpose, and give every agent a strong identity and a clear, accountable owner."
      sourceIds: [double-agents-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: growth
      text: "IDC predicts 1.3 billion agents by 2028."
      caveat: "IDC research sponsored by Microsoft and cited in Microsoft's launch post. It is not a Microsoft figure."
      sourceIds: [a365-launch-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
gaps:
  heading: "What the customer may lack without Agent 365"
  intro: "Microsoft's licensing FAQ says customers who rely on Microsoft 365 E5 alone, which protects users and data, may have limited visibility and control in four areas."
  items:
    - id: central-inventory
      text: "A central inventory and governance of all agents across platforms."
      themeId: see-every-agent
      sourceIds: [lic-faq]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: agent-interactions
      text: "Agent-to-agent and agent-to-tool interactions."
      themeId: watch-what-agents-do
      sourceIds: [lic-faq]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: lifecycle-policy
      text: "Consistent lifecycle management and policy enforcement for agents."
      themeId: owner-and-policy
      sourceIds: [lic-faq]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: own-access-agents
      text: "Agents that operate outside a user's context, with their own access."
      themeId: control-reach
      sourceIds: [lic-faq]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
themes:
  heading: "What Agent 365 gives the customer"
  intro: "Seven outcomes across security, governance and observability. Each lists the capabilities behind it, so every claim traces to the service description."
  angleLabel: "How to say it"
  aiAngleLabel: "AI seller"
  securityAngleLabel: "Security seller"
  capabilitiesLabel: "Capabilities behind it"
  ownersLabel: "Configured in"
  items:
    - id: see-every-agent
      title: "See every agent"
      pillar: observe
      outcome: "One inventory of the agents in use, including agents built on other platforms and agents running on devices, so ownership and policy have a starting point."
      angle:
        ai: "Gives the AI team a trusted list of what is running, so leaders see the real agent estate."
        security: "Closes the shadow-agent gap: security cannot protect agents it does not know exist."
      capabilityIds: [registry-inventory, registry-sync, defender-shadow-ai]
      reviewStatus: draft
    - id: watch-what-agents-do
      title: "Watch what agents do"
      pillar: observe
      outcome: "Telemetry and investigation tools show agent activity, so teams can spot unusual behavior and look into incidents."
      angle:
        ai: "Shows how agents are used and how they perform, so owners can improve them and judge their value."
        security: "Gives security operations agent activity to hunt through, in the Defender tools they already use."
      capabilityIds: [observability, defender-hunting]
      reviewStatus: draft
    - id: owner-and-policy
      title: "Put an owner and a policy on every agent"
      pillar: govern
      outcome: "Admins can approve, block, reassign and retire agents, set policy templates and automate lifecycle rules, so every agent has a responsible person."
      angle:
        ai: "Lets the business keep building while IT sets the guardrails once, instead of reviewing each agent by hand."
        security: "Gives every agent an accountable person and a lifecycle, so access does not outlive its purpose."
      capabilityIds:
        - governance-actions
        - lifecycle-automation
        - policy-templates
        - entra-sponsor-lifecycle
        - registry-graph-api
      reviewStatus: draft
    - id: control-reach
      title: "Control what agents can reach"
      pillar: secure
      outcome: "Identity, tool, network and device controls limit what an agent can access, whether it acts for a user or as itself."
      angle:
        ai: "Teams give an agent the access its task needs, scoped and reviewable by IT."
        security: "Extends Conditional Access, access packages and tool and network controls to agent identities: least privilege for agents."
      capabilityIds:
        - entra-conditional-access
        - entra-access-packages
        - tool-controls
        - entra-network-controls
        - intune-device-compliance
      reviewStatus: draft
    - id: protect-data
      title: "Protect the data agents touch"
      pillar: secure
      outcome: "Sensitivity labels, data loss prevention, DSPM for AI and Insider Risk apply to what agents read and share."
      angle:
        ai: "Answers the data-protection question security and compliance raise before an agent goes live."
        security: "Brings the labels and DLP policies the customer already uses to agent activity, in Purview."
      capabilityIds: [purview-labels, purview-dlp, purview-dspm-ai, purview-insider-risk]
      reviewStatus: draft
    - id: stop-threats
      title: "Detect and stop agent threats"
      pillar: secure
      outcome: "Posture management, threat detection with tool-call blocking, runtime policy and blocking of unsanctioned local agents address misuse and attack."
      angle:
        ai: "Gives leaders a security answer for agents that act on their own."
        security: "Adds agent-specific posture, detection and blocking to the Defender and Intune tools security operations already run."
      capabilityIds:
        - defender-posture
        - defender-threat-protection
        - intune-runtime-policy
        - intune-block-local
      reviewStatus: draft
    - id: prove-compliance
      title: "Keep evidence for audit and compliance"
      pillar: govern
      outcome: "Audit logs, eDiscovery, data lifecycle and communication compliance cover agent interactions, so the customer can answer legal and regulatory requests."
      angle:
        ai: "Gives the business a way to show auditors and regulators how an agent behaved."
        security: "Extends the audit and retention tools compliance teams already use to agent activity."
      capabilityIds: [purview-audit-ediscovery, purview-dlm, purview-ai-compliance]
      reviewStatus: draft
