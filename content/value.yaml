# Seller guidance for any agent and any use case. Facts carry their Microsoft source and the date it was read.
# The outcomes behind the value brief, the answers to pushback and the joint plan are editorial: seller guidance,
# draft until subject-matter-expert review. This file states no price and no competitor comparison.
reviewStatus: draft
notice: "Seller guidance, not Microsoft messaging. Facts name their Microsoft source. Angles and objection answers are editorial and stay draft until subject-matter-expert review."
problem:
  statements:
    - id: sprawl
      text: "Existing controls for users, applications and data do not fully address how agents operate. Without a central view, agents multiply with no clear oversight. Microsoft calls this agent sprawl."
      sourceIds: [a365-why]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: proliferation
      text: "Agents spread quickly across apps, endpoints and cloud, and often operate outside the visibility and control of the teams accountable for risk."
      sourceIds: [a365-ga-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: visibility-first
      text: "Microsoft's framing is that you cannot govern what you cannot see, and you cannot secure what you do not understand."
      sourceIds: [a365-ga-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: security-questions
      text: "Security leaders are asking how to track all these agents, what they are doing, whether they have the right access, whether they can leak data, whether they are protected from threats, and how to govern them."
      sourceIds: [a365-frontier-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: point-solutions
      text: "Microsoft argues this needs more than point solutions: a control plane designed for managing agents at enterprise scale."
      sourceIds: [a365-why]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: agentic-zero-trust
      text: "Microsoft's guidance for security leaders is Agentic Zero Trust: do not trust agents blindly, keep each agent's access within its role and purpose, and give every agent a strong identity and a clear, accountable owner."
      sourceIds: [double-agents-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
    - id: growth
      text: "IDC predicts 1.3 billion agents by 2028."
      caveat: "IDC research sponsored by Microsoft and cited in Microsoft's launch post. It is not a Microsoft figure."
      sourceIds: [a365-launch-blog]
      evidence: stated
      reviewStatus: draft
      lastVerified: "2026-10-27"
themes:
  heading: "What Agent 365 gives the customer"
  items:
    - id: see-every-agent
      title: "See every agent"
      pillar: observe
      outcome: "One inventory of the agents in use, including agents built on other platforms and agents running on devices, so ownership and policy have a starting point."
      angle:
        ai: "Gives the AI team a trusted list of what is running, so leaders see the real agent estate."
        security: "Closes the shadow-agent gap: security cannot protect agents it does not know exist."
      capabilityIds: [registry-inventory, registry-sync, defender-shadow-ai]
      defaultFor: [ai, security, joint]
      reviewStatus: draft
    - id: watch-what-agents-do
      title: "Watch what agents do"
      pillar: observe
      outcome: "Telemetry and investigation tools show agent activity, so teams can spot unusual behavior and look into incidents."
      angle:
        ai: "Shows how agents are used and how they perform, so owners can improve them and judge their value."
        security: "Gives security operations agent activity to hunt through, in the Defender tools they already use."
      capabilityIds: [observability, defender-hunting]
      defaultFor: [ai, joint]
      reviewStatus: draft
    - id: owner-and-policy
      title: "Put an owner and a policy on every agent"
      pillar: govern
      outcome: "Admins can approve, block, reassign and retire agents, set policy templates and automate lifecycle rules, so every agent has a responsible person."
      angle:
        ai: "Lets the business keep building while IT sets the guardrails once, instead of reviewing each agent by hand."
        security: "Gives every agent an accountable person and a lifecycle, so access does not outlive its purpose."
      capabilityIds:
        - governance-actions
        - lifecycle-automation
        - policy-templates
        - entra-sponsor-lifecycle
        - registry-graph-api
      defaultFor: [ai, joint]
      reviewStatus: draft
    - id: control-reach
      title: "Control what agents can reach"
      pillar: secure
      outcome: "Identity, tool, network and device controls limit what an agent can access, whether it acts for a user or as itself."
      angle:
        ai: "Teams give an agent the access its task needs, scoped and reviewable by IT."
        security: "Extends Conditional Access, access packages and tool and network controls to agent identities: least privilege for agents."
      capabilityIds:
        - entra-conditional-access
        - entra-access-packages
        - tool-controls
        - entra-network-controls
        - intune-device-compliance
      defaultFor: [security, joint]
      reviewStatus: draft
    - id: protect-data
      title: "Protect the data agents touch"
      pillar: secure
      outcome: "Sensitivity labels, data loss prevention, DSPM for AI and Insider Risk apply to what agents read and share."
      angle:
        ai: "Answers the data-protection question security and compliance raise before an agent goes live."
        security: "Brings the labels and DLP policies the customer already uses to agent activity, in Purview."
      capabilityIds: [purview-labels, purview-dlp, purview-dspm-ai, purview-insider-risk]
      defaultFor: [security, joint]
      reviewStatus: draft
    - id: stop-threats
      title: "Detect and stop agent threats"
      pillar: secure
      outcome: "Posture management, threat detection with tool-call blocking, runtime policy and blocking of unsanctioned local agents address misuse and attack."
      angle:
        ai: "Gives leaders a security answer for agents that act on their own."
        security: "Adds agent-specific posture, detection and blocking to the Defender and Intune tools security operations already run."
      capabilityIds:
        - defender-posture
        - defender-threat-protection
        - intune-runtime-policy
        - intune-block-local
      defaultFor: [security, joint]
      reviewStatus: draft
    - id: prove-compliance
      title: "Keep evidence for audit and compliance"
      pillar: govern
      outcome: "Audit logs, eDiscovery, data lifecycle and communication compliance cover agent interactions, so the customer can answer legal and regulatory requests."
      angle:
        ai: "Gives the business a way to show auditors and regulators how an agent behaved."
        security: "Extends the audit and retention tools compliance teams already use to agent activity."
      capabilityIds: [purview-audit-ediscovery, purview-dlm, purview-ai-compliance]
      defaultFor: []
      reviewStatus: draft
objections:
  heading: "Answer the pushback"
  intro: "Suggested answers built from Microsoft's published pages. They are seller guidance, not Microsoft statements."
  items:
    - id: just-entra-defender-purview
      objection: "Isn't this just Entra, Defender and Purview?"
      answer: "Agent 365 builds on those tools rather than replacing them. Microsoft describes a separation of concerns: Agent 365 discovers, inventories and manages all agents and monitors activity, while Entra manages agent identities, identity governance and Conditional Access. Agent 365 also surfaces its controls in the portals those teams already use."
      sourceIds: [a365-entra-capabilities, entra-registry-convergence, a365-security]
      evidence: inferred
      reviewStatus: draft
    - id: platform-governance
      objection: "Can't each platform govern its own agents?"
      answer: "Each platform sees its own agents. Agent 365 brings agents from Microsoft platforms, supported third-party platforms and connected clouds into one registry. Microsoft names three integration paths: native integration, the Agent 365 SDK and registry sync."
      sourceIds: [a365-sdk, sd-a365]
      evidence: inferred
      reviewStatus: draft
    - id: license-every-agent
      objection: "Do we have to license every agent?"
      answer: "No. Microsoft says Agent 365 is licensed per user, and agents, blueprints and agent instances are not licensed separately. Which people need a license depends on how the agent acts. The Licensing page sets it out; confirm with your licensing specialist."
      sourceIds: [lic-faq]
      evidence: stated
      reviewStatus: draft
    - id: copilot-enough
      objection: "We have Microsoft 365 Copilot. Isn't that enough?"
      answer: "Microsoft's licensing FAQ says Agent 365 is needed in addition, to manage, govern and secure all agents beyond Copilot. It puts it this way: Copilot is about what AI can do, and Agent 365 is about controlling what AI is allowed to do."
      sourceIds: [lic-faq]
      evidence: stated
      reviewStatus: draft
    - id: already-e5
      objection: "We already have Microsoft 365 E5."
      answer: "They are complementary. Microsoft says E5 protects users and data, Agent 365 protects agents, and E7 protects both. E5, or E3 with the Defender and Purview suites, is also a licensing prerequisite for core Agent 365 functionality."
      sourceIds: [lic-faq]
      evidence: stated
      reviewStatus: draft
    - id: other-clouds
      objection: "Our agents are built on AWS or Google."
      answer: "Registry sync can make agents built on Amazon Bedrock or Google Vertex AI visible in the Microsoft 365 admin center with no development work. It was in public preview at the May 2026 launch, so check the current status."
      sourceIds: [a365-third-party, a365-ga-blog]
      evidence: stated
      reviewStatus: draft
    - id: slow-builders
      objection: "Won't this slow our builders down?"
      answer: "Microsoft describes lightweight guardrails for observability and accountability that give control and trust while teams keep moving quickly."
      sourceIds: [a365-docs]
      evidence: stated
      reviewStatus: draft
    - id: few-agents
      objection: "We only have a few agents today."
      answer: "Visibility comes first, and agent numbers are expected to grow: IDC predicts 1.3 billion agents by 2028, in research Microsoft sponsored. Microsoft's admin guidance is to bring agents under control from day one."
      sourceIds: [a365-launch-blog, a365-admin-overview]
      evidence: inferred
      reviewStatus: draft
