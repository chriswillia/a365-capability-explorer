        to: "/diagnostic"
      - id: licensing
        question: "Who has to be licensed, and what must be in place first?"
        title: "Licensing and prerequisites"
        body: "Who needs an Agent 365 license by how the agent acts, which plans and underlying services are required, and what to ask your licensing specialist."
        cta: "Check licensing"
        to: "/licensing"
    libraryNote: "Need the detail? The Library menu holds stack fit, how agents act, the capabilities, agent scenarios, Learn, the agent portfolio and the workshop kit."
  recent:
    heading: "Pick up where you left off"
    useCases: "{count} {count?use case|use cases}"
    readout: Readout
    licensing: Licensing
    edit: Edit
    start: "Map an agent"

