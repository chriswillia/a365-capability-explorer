privacy:
  statement: "This site uses no cookies or analytics. Catalog searches, filters and comparison selections appear in the URL, as do the outcomes you choose for a value brief, the platforms and tools you tick on Stack fit, and the saved assessment you pick on the Licensing and How an agent acts pages (an identifier, not a name); loading or sharing that URL exposes its query string to the host or recipient. A customer name typed for a value brief or a licensing note stays in memory on that page: it is never placed in the URL or stored. Do not enter confidential information in catalog search. GitHub Pages logs visitor IP addresses for security purposes."
  storedHeading: "What this site stores in your browser"
  storedIntro: "Application preferences and saved assessments are kept in local storage in this browser profile. Navigation scroll positions use session storage. Other people using this profile can access saved data. Clearing site data removes it."
  storedColumns:
    what: What
    where: Where
    why: Why
  stored:
    - what: "Your detail level choice (Executive or Technical)"
      where: "Local storage, key cpcompass:depth"
      why: "So the site remembers your choice on your next visit"
    - what: "Whether you sell as an AI seller, a Security seller or both"
      where: "Local storage, key cpcompass:audience"
      why: "So the pitch and talk tracks match your role on your next visit"
    - what: "Customer profiles, assessment answers, which answers came from a starting scenario and are not yet confirmed, optional names, optional normalized PNG logos and their descriptions, assessment mode and current section"
      where: "Local storage, key cpcompass:diagnostic"
      why: "Autosave and resume local assessments, and let the header link back to the customer you are working on. Nothing is uploaded. Delete individual assessments or unused customers from the assessment page."
    - what: "Navigation scroll positions managed by React Router"
      where: "Session storage, key react-router-scroll-positions"
      why: "Restore scroll position during navigation. This is not assessment answer storage."
  selfHostedHeading: "Fonts and other files"
  selfHosted: "Fonts and every other file are served from this site. Pages make no requests to other sites."
  futureNote: "Saved assessments remain local to this browser profile, not your account or another device. Portfolio views reuse those assessments; portfolio selection and presentation mode are temporary and add no stored preference. JSON backups and selected portfolio bundles, Markdown, copied summaries, PDF and PowerPoint contain your answers and optional names. JSON, PDF and PowerPoint also include any selected logo. Review them before sharing; exported files are not encrypted by this app. Import reads a selected file locally and adds copies without uploading it or overwriting existing data. A storage error is shown explicitly; unsaved changes may be lost if you refresh or leave."
