mapping:
  intro: "Use illustrative agent patterns to explore how capabilities fit together. Every recommendation is generated by the same rules, not a hand-maintained matrix."
  neutralNote: "Pattern results use a neutral commercial organization: one agent, no organization-wide governance or security-operations priorities, and no declared shadow-AI concern. Licensing, enrollment and platform readiness are unknown until verified. Canonical answers are examples, not facts about your organization."
  matrix: "Generated Pattern × Capability matrix"
  patternCount: "In-scope capabilities"
  levels: { essential: Essential, recommended: Recommended, consider: Consider }
  levelDescriptions:
    essential: "Prioritize in this planning scenario; not an official product or licensing mandate."
    recommended: "A useful supporting control to discuss with the owning team."
    consider: "A conditional option worth checking for the chosen environment."
  condition:
    always: "All agent scenarios"
    all: "All of"
    any: "Any of"
    not: "Not"
    equals: "is"
    in: "is one of"
    includes: "includes"
    includesAny: "includes any of"
    answered: "has a known answer"
    unanswered: "has no known answer"
    unknown: "is unknown"
    known: "is known"
  inScope: "In scope"
  notInScope: "Not currently in scope"
  becomesRelevant: "Becomes relevant if"
  noRule: "No configured recommendation rule; verify planning relevance with the owner."
  reasons: "Why this is in scope"
  origin: { org: Organization, useCase: Use case }
  answers: "Canonical answers and assumptions"
  unknownAnswer: "Unknown — verify"
  readiness: "Configured readiness checks"
  readinessNote: "This is not deployment or licensing certification. Ready means only that the configured gap conditions are false. The score is ready checks divided by all applicable configured checks; unknown checks remain in the denominator. Capabilities without checks remain unknown and do not enter that percentage."
  readinessStatuses:
    { ready: "Ready for configured checks", gap: "Planning gap", unknown: "Unknown — verify" }
  readinessPercent: "Configured checks ready"
  noChecks: "No configured checks; readiness is unknown."
  anatomy: "Control-plane anatomy"
  operatingModel: "Owner team × lifecycle operating model"
  agentDecisions: "Decisions for this agent"
  risks: "Triggered risk themes"
  riskNote: "Editorial risk-to-capability associations, pending SME review. A mitigation association is not proof of enforcement or a guarantee of prevention. Not in scope means no rule matched, not that a capability is unnecessary."
  mitigationsInScope: "Mitigations in scope"
  mitigationsOutOfScope: "Mitigations not currently in scope"
  potentialRisks: "Risk themes with unknown applicability"
  noRisks: "No risk themes in this state."
  riskAssociations: "Risk associations"
  integration: "Integration paths and checklist"
  verify: "Verify current support"
  frontier: "Frontier Firm planning association"
  frontierNote: "Editorial association only, not an organizational maturity rating, official phase rule or Frontier preview enrollment decision. Mixed access can relate to multiple phases."
  licensing: "Licensing and audience"
  licensingCounts: "Foundational / premium capability counts"
  expectedUsers: "Illustrative user range, not a license quantity"
  intensity: "Control intensity"
  intensityNote: "Planning density, not a risk or maturity score. Essential = 3, Recommended = 2, Consider = 1; normalize against all catalog capabilities at 3 points each, overall and within each pillar."
  gcc: "In-scope capabilities marked unavailable in GCC"
  sovereign: "GCC data must not be extrapolated to GCC High, DoD or other sovereign clouds."
  advisories: "Advisories and verification"
  openQuestions: "Open questions"
  methodology: "How the mapping works"
  rules: "Rule catalog"
  assumptions: "Condition and merge semantics"
  methodologyNotes:
    - "Inputs are typed single- or multiple-choice answers. Multi-select none and unknown cannot be combined with other choices. Invalid question ids, answer shapes, scopes and option values are rejected."
    - "Conditions use three-valued logic: true, false or unknown. Missing, null, empty and explicitly unknown answers stay unknown. Not preserves unknown; all is false if any child is false, and any is true if any child is true. Only a true condition triggers a recommendation."
    - "Each condition renders question and option labels. Organization rules use organization inputs; use-case rules may also consult organization context. Reason origins follow the rule scope."
    - "The highest recommendation level wins, but every matching rule, reason, evidence label, source and origin is retained. The earliest explicit wave override wins; otherwise the capability's default wave applies. Results sort by pillar order, level, then capability short name."
    - "Not currently in scope does not mean unnecessary. Its matching conditions remain visible as becomes-relevant explanations. Unknown risk applicability and unresolved inputs are reported separately."
    - "Stated identifies a source-backed applicability claim; inferred identifies a deduction; advisor judgment identifies an editorial choice. Recommendation levels, canonical patterns, risk associations and operating-model groupings are planning advice, not official mandates."
    - "The matrix is generated from canonical pattern answers and the displayed neutral organization. It does not add large-estate or security-operations priorities. Readiness and licensing are never inferred from a pattern alone."
    - "Golden scenarios assert Essential inclusions and complete exclusions for each pattern and sample. Automated agreement is not SME approval: unsigned scenarios produce build warnings until a reviewer and date are recorded."
  pendingDiagnostic: "These are read-only planning results. Customize a pattern in the local diagnostic to create a saved readout and canvas."
