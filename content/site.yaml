productName: A365 Capability Explorer
tagline: "Map any agent use case to Microsoft Agent 365."
description: "For Microsoft AI and security sellers: explain the value of Agent 365 for any agent, scope how an agent acts and what guardrails it needs, fit it to the customer's stack, and check licensing and prerequisites."

# While false, every page carries a noindex tag. Set to true at launch (Phase 7).
indexable: false
repoUrl: "https://github.com/chriswillia/a365-capability-explorer"
