  verify: "Verify current support"
  frontier: "Frontier Firm planning association"
  frontierNote: "Editorial association only, not an organizational maturity rating, official phase rule or Frontier preview enrollment decision. Mixed access can relate to multiple phases."
  licensing: "Licensing and audience"
  licensingCounts: "Included / needs-Agent 365 capability counts"
  expectedUsers: "Illustrative user range, not a license quantity"
  intensity: "Governance effort"
  intensityNote: "A planning measure, not a risk or maturity score. Essential = 3, Recommended = 2, Consider = 1; the total is compared with 3 points for every catalog capability, overall and within each requirement area."
  gcc: "In-scope capabilities marked unavailable in GCC"
  sovereign: "GCC data must not be extrapolated to GCC High, DoD or other sovereign clouds."
  advisories: "Advisories and verification"
  openQuestions: "Open questions"
  methodology: "How recommendations work"
  quickTitle: "Before you rely on a recommendation"
  quick:
    - question: "Does Essential mean required?"
      answer: "No. Essential, Recommended and Consider are planning priorities for a discussion. They are not product requirements or licensing mandates, and they are separate from the service description's licensing column."
    - question: "What does not currently in scope mean?"
      answer: "No rule matched the current answers. It does not mean the capability is unnecessary; each capability shows what would bring it into scope."
    - question: "What do Stated, Inferred and Recommendation (needs review) mean?"
      answer: "Stated: a source says it directly. Inferred: it follows from a source's description. Recommendation (needs review): an editorial choice that needs subject-matter-expert review."
    - question: "How are unknown answers treated?"
      answer: "Unknown stays unknown. Only matching rules create recommendations, and the open questions show which unknowns could change the result."
    - question: "Is this a licensing determination?"
      answer: "No. This tool does not decide whether a customer's plans qualify. Confirm eligibility with the service description, the Microsoft Product Terms and your Microsoft account team."
  levelsTitle: "What the recommendation levels mean"
  engineTitle: "Engine rules and conditions (for reviewers)"
  rules: "Rule catalog"
  assumptions: "Condition and merge semantics"
  methodologyNotes:
    - "Inputs are typed single- or multiple-choice answers. Multi-select none and unknown cannot be combined with other choices. Invalid question ids, answer shapes, scopes and option values are rejected."
    - "Conditions use three-valued logic: true, false or unknown. Missing, null, empty and explicitly unknown answers stay unknown. Not preserves unknown; all is false if any child is false, and any is true if any child is true. Only a true condition triggers a recommendation."
    - "Each condition renders question and option labels. Organization rules use organization inputs; use-case rules may also consult organization context. Reason origins follow the rule scope."
    - "The highest recommendation level wins, but every matching rule, reason, evidence label, source and origin is retained. The earliest explicit wave override wins; otherwise the capability's default wave applies. Results sort by requirement area (in display order), level, then capability short name."
    - "Not currently in scope does not mean unnecessary. Its matching conditions remain visible as becomes-relevant explanations. Unknown risk applicability and unresolved inputs are reported separately."
    - "Stated identifies a source-backed applicability claim; inferred identifies a deduction; recommendation (needs review) identifies an editorial choice. Recommendation levels, canonical scenarios, risk associations and operating-model groupings are planning advice, not official mandates."
    - "The matrix is generated from canonical scenario answers and the displayed neutral customer. It does not add large-estate or security-operations priorities. Readiness and licensing are never inferred from a scenario alone."
    - "Every scenario and sample is checked automatically for the capabilities it must include and exclude. Automated agreement is not SME approval."
  pendingDiagnostic: "These are read-only planning results. Map an agent from a scenario to customize it and create a saved readout and canvas."
  startAssessment: "Map an agent"
  back: "Back to scenarios"
  typicalPatterns: "Typical scenarios"
  whenInScope: "When this capability is in scope"
  why: "Reason and evidence"
  samples: "Illustrative sample use cases"
  sampleNote: "Fictional discussion starters, not claims about deployed customer solutions. Sample results reuse their scenario plus the visible answer overrides."
  whatIfs: "Illustrative what-if changes"
  added: Added
  removed: Removed
  changed: "Level changed"
  noChanges: "No recommendation change"
  scenarioSource: "Source basis"
  hostingSources: "Implementation and hosting references"
