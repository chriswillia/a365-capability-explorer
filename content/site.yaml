routes:
  overview:
    title: Home
    description: "Explain the value of Agent 365 for any agent, map the agent, check licensing and prerequisites, and leave the customer with a clear summary."
  pitch:
    title: Pitch
    description: "What to say about Agent 365 for any agent: a 60-second pitch for AI and Security sellers, the problem, the outcomes by capability, who you are talking to, answers to pushback, and how to run the conversation."
  licensing:
    title: "Licensing and prerequisites"
    description: "Who needs an Agent 365 license by how the agent acts, which plans and underlying services are required, and what each capability needs to work."
  fit:
    title: "Stack fit"
    description: "How each agent platform connects to Agent 365, what it adds to the Microsoft tools a customer already runs, and what stays where it is."
  access:
    title: "How an agent acts"
    description: "Delegated access, own access and an agent account in Microsoft's terms: what each means, who to license, what applies differently and how it changes the capabilities for an assessment."
  capabilities:
    title: Capabilities
    description: "Every capability in the Microsoft Agent 365 service description, grouped by area (Observe, Govern, Secure), with where each is configured."
  capability:
    title: Capability brief
    description: "A one-page brief for each capability: the official wording, what it does, where it acts, who owns it and when it applies."
  patterns:
    title: "Agent scenarios"
    description: "Common types of agent, and the security, governance and observability capabilities that typically apply to each."
  pattern:
    title: "Scenario brief"
    description: "One type of agent: what it is, the platforms it typically runs on, and the capabilities and risks that apply."
  learn:
    title: Learn
    description: "Agent 365 in plain language: where it fits, myths versus facts, how a request flows, the building blocks, the journey to a Frontier Firm and a glossary."
  diagnostic:
    title: "Map an agent"
    description: "Describe your customer and an agent use case to see which capabilities apply across security, governance and observability, and why."
  assessment:
    title: Assessment
    description: "Answer the questions for one agent use case and watch the requirements fill in."
  readout:
    title: Readout
    description: "A customer-ready readout of the assessment, in Executive and Technical views."
  canvas:
    title: "Use case canvas"
    description: "A one-page canvas that summarizes one agent use case and its Agent 365 controls."
  portfolio:
    title: "Agent portfolio"
    description: "Compare several agents for one customer: governance effort against business value, shared foundations and readiness gaps."
  workshop:
    title: "Workshop kit"
    description: "A facilitator guide, printable scenario and capability cards, a requirements checklist and a blank canvas for a 90-minute session."
  conversation:
    title: "Run a customer conversation"
    description: "The conversation guide now lives on the Pitch page: the questions to ask across security, governance and observability, who to involve and what to flag."
  methodology:
    title: "How recommendations work"
    description: "How recommendations are made: levels, evidence tags, the rules, the sources and the disclaimers."
  whatsNew:
    title: "What's new"
    description: "Content changes, and the scenarios each change affects."
  contentHealth:
    title: "Content health"
    description: "Content that is stale, still in draft, or where sources differ."
  privacy:
    title: Privacy
    description: "What this site stores, where it stores it, and what GitHub Pages logs."
  notFound:
    title: "Page not found"
    description: "The page you asked for does not exist."

overview:
  heroEyebrow: "For Microsoft AI and security sellers"
  heroLede: "Tell the value story for any customer, map the agent and the guardrails it needs, check who needs which license and what must be in place first, and fit Agent 365 into their stack. Choose AI seller, Security seller or Both in the header to match the pitch to your role."
  ctaPrimary: "Start with the pitch"
  ctaSecondary: "Map an agent"
  jobs:
    heading: "What do you need right now?"
    intro: "Each job works for any agent. Take the one you need, or work through them in order."
    tiles:
      - id: pitch
        question: "What do I say?"
        title: Pitch
        body: "A 60-second pitch for AI and Security sellers, the problem every agent creates, what Agent 365 gives the customer and answers to pushback. It works before you know the use case."
        cta: "Open the pitch"
        to: "/pitch"
      - id: map
        question: "What does this agent need?"
        title: "Map an agent"
        body: "Describe one agent, including whether it acts for a user or as itself, and see the capabilities, guardrails and gaps that apply."
