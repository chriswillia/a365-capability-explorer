# Editorial facilitation advice for a customer conversation. It states no product facts: the capabilities,
# questions, owner teams and availability flags on the page are computed from capabilities.yaml.
reviewStatus: draft
title: "Run the conversation"
introduction: "Use this guide to run a customer conversation about an agent. Work through security, governance and observability in turn, record what the customer confirms, and leave a readout and a checklist. The advice is draft facilitation guidance, not an approved sales process or a licensing determination."
stepsTitle: "Five steps"
steps:
  - id: frame
    title: "Frame the outcome"
    instruction: "Start with what the agent should achieve and who is accountable for it. Treat Agent 365 requirements as the way to make that outcome safe, governed and observable, rather than as a product list."
    action:
      label: "Start with the 60-second pitch"
      to: "/pitch#pitch"
  - id: describe
    title: "Describe the agent"
    instruction: "Capture the users, data, actions and tools, and whether the agent acts for a user, as itself or through its own account. Start from the closest scenario, then correct its assumptions with the customer; answers you did not hear from the customer stay marked as assumed."
    action:
      label: "Map an agent"
      to: "/map"
  - id: walk
    title: "Walk through each requirement area"
    instruction: "Discuss security, governance and observability in turn using the sections below: what the customer needs, which capabilities apply, who configures them and what to flag."
  - id: confirm
    title: "Confirm assumptions and unknowns"
    instruction: "Mark each answer the customer confirmed. Record unknowns as follow-ups instead of guessing, and check licensing, prerequisites and GCC or other sovereign cloud availability."
    action:
      label: "Check licensing and prerequisites"
      to: "/licensing"
  - id: leave
    title: "Leave a readout and a checklist"
    instruction: "Review the readout and the requirements checklist for sensitive information before sharing. Agree an owner and a date for each gap, unknown and licensing question."
    action:
      label: "Open the workshop kit and checklist"
      to: "/workshop#checklist"
requirementsTitle: "Security, governance and observability"
requirementsIntro: "Each area is built from the catalog, so it updates when the service description changes. Questions come from each capability's discovery questions; owner teams come from where each capability is configured."
jumpLabel: "Jump to a requirement area"
coversLabel: "What this area covers"
capabilitiesLabel: "Capabilities to discuss"
questionsLabel: "Questions to ask the customer ({count})"
peopleLabel: "Who to involve"
flagsLabel: "Licensing and availability flags"
flagsTemplate: "{premium} of {total} {premium?needs|need} Agent 365 (or E7/G7); {notInGcc} {notInGcc?is|are} not available in GCC. Confirm licensing and availability against the official sources."
browse: "Browse {label} capabilities"
assumptionsTitle: "Assumptions to check before you answer"
assumptionsNote: "{count} of {total} myth-and-fact answers {count?still needs|still need} verification against their source. Read the official source before you answer a licensing question; do not repeat a premise you have not confirmed."
assumptionsClear: "All {total} myth-and-fact answers name their Microsoft source and the date it was read. Read the source before you answer a licensing question, and say when a point is not stated."
assumptionsLink: "Open myths and facts"
nextTitle: "After the conversation"
next:
  - label: "Map an agent"
    to: "/map"
  - label: "See how the way the agent acts changes the answer"
    to: "/access"
  - label: "Check licensing and prerequisites"
    to: "/licensing"
  - label: "Fit it to the customer's stack"
    to: "/fit"
  - label: "Compare agents for one customer"
    to: "/portfolio"
  - label: "Print the requirements checklist"
    to: "/workshop#checklist"
